name: AIR-NET-5090
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - numpy=1.26.4

  - pip:
    # PyTorch CUDA 12.8, suitable for RTX 5090 / Blackwell
    - --index-url https://download.pytorch.org/whl/cu128
    - --extra-index-url https://pypi.org/simple

    - torch==2.11.0
    - torchvision==0.26.0

    # Other dependencies
    - tensorboard==2.20.0
    - scipy==1.12.0
    - imageio
    - tifffile
    - scikit-image
    - matplotlib
    - six==1.16.0
    - tqdm==4.64.1
    - mat73==0.59
    - absl-py
